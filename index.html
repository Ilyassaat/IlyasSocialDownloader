<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ilyas Downloader</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(80,90,150,.25), transparent 35%),
                radial-gradient(circle at 80% 90%, rgba(120,60,120,.20), transparent 35%),
                #08090d;
            color: #fff;
        }

        .container {
            width: min(1050px, 94%);
            margin: auto;
            padding: 35px 0 50px;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #ffffff,
                #8c8c8c
            );

            color: #111;
            font-size: 25px;
            font-weight: 900;

            box-shadow:
                0 15px 50px rgba(255,255,255,.10);
        }

        .header h1 {
            font-size: 42px;
            margin-top: 18px;
            letter-spacing: -1px;
        }

        .header p {
            color: #8d94a3;
            margin-top: 10px;
            font-size: 15px;
        }

        /* MAIN CARD */

        .card {
            background: rgba(18,20,27,.90);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 25px;

            padding: 28px;

            box-shadow:
                0 30px 100px rgba(0,0,0,.45);

            backdrop-filter: blur(20px);
        }

        /* URL */

        .url-area {
            display: flex;
            gap: 12px;
        }

        .url-input {
            flex: 1;

            height: 58px;

            border-radius: 15px;

            border: 1px solid #303541;

            background: #0d1016;

            color: white;

            padding: 0 18px;

            font-size: 16px;

            outline: none;
        }

        .url-input:focus {
            border-color: #777;
        }

        .info-button {
            height: 58px;

            padding: 0 25px;

            border: none;

            border-radius: 15px;

            background: white;

            color: #111;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .info-button:hover {
            background: #ddd;
        }

        /* VIDEO */

        .video-card {
            display: none;

            margin-top: 25px;

            padding: 18px;

            border-radius: 18px;

            background: #0d1016;

            border: 1px solid #282d38;
        }

        .video-content {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .thumbnail {
            width: 240px;

            aspect-ratio: 16 / 9;

            object-fit: cover;

            border-radius: 13px;

            background: #181b23;
        }

        .video-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
        }

        .video-meta {
            color: #858c99;
            margin-top: 10px;
            font-size: 14px;
        }

        /* SETTINGS */

        .settings {
            display: none;

            margin-top: 25px;
        }

        .settings-title {
            font-size: 18px;
            font-weight: 700;

            margin-bottom: 15px;
        }

        .settings-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        .setting {
            padding: 16px;

            background: #0d1016;

            border: 1px solid #282d38;

            border-radius: 15px;
        }

        .setting label {
            display: block;

            margin-bottom: 9px;

            color: #8d94a3;

            font-size: 13px;
        }

        select {
            width: 100%;

            height: 45px;

            border-radius: 10px;

            border: 1px solid #303541;

            background: #151922;

            color: white;

            padding: 0 12px;

            outline: none;
        }

        /* DOWNLOAD */

        .download-button {
            width: 100%;

            height: 58px;

            margin-top: 20px;

            border: none;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #bcbcbc
            );

            color: #111;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;
        }

        .download-button:hover {
            filter: brightness(.9);
        }

        /* STATUS */

        .status {
            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #11151d;

            text-align: center;

            color: #aeb4c0;
        }

        .error {
            color: #ff7474;
        }

        .success {
            color: #70e38a;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #555d6b;

            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                padding-top: 20px;
            }

            .header h1 {
                font-size: 32px;
            }

            .card {
                padding: 18px;
            }

            .url-area {
                flex-direction: column;
            }

            .info-button {
                width: 100%;
            }

            .video-content {
                flex-direction: column;
                align-items: stretch;
            }

            .thumbnail {
                width: 100%;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            ID
        </div>

        <h1>
            Ilyas Downloader
        </h1>

        <p>
            Instagram • TikTok • Facebook • YouTube
        </p>

    </div>


    <!-- MAIN -->

    <div class="card">

        <!-- URL -->

        <div class="url-area">

            <input
                id="url"
                class="url-input"
                type="text"
                placeholder="Video bağlantısını buraya yapıştır..."
            >

            <button
                class="info-button"
                onclick="getVideoInfo()"
            >
                Videoyu Getir
            </button>

        </div>


        <!-- VIDEO INFO -->

        <div
            id="videoCard"
            class="video-card"
        >

            <div class="video-content">

                <img
                    id="thumbnail"
                    class="thumbnail"
                    src=""
                    alt="Video thumbnail"
                >

                <div>

                    <div
                        id="videoTitle"
                        class="video-title"
                    >
                        Video
                    </div>

                    <div
                        id="videoMeta"
                        class="video-meta"
                    >
                    </div>

                </div>

            </div>

        </div>


        <!-- SETTINGS -->

        <div
            id="settings"
            class="settings"
        >

            <div class="settings-title">
                İndirme Ayarları
            </div>


            <div class="settings-grid">


                <!-- FORMAT -->

                <div class="setting">

                    <label>
                        Dosya türü
                    </label>

                    <select
                        id="format"
                        onchange="formatChanged()"
                    >

                        <option value="mp4">
                            MP4 Video
                        </option>

                        <option value="mp3">
                            MP3 Ses
                        </option>

                    </select>

                </div>


                <!-- QUALITY -->

                <div
                    id="qualitySetting"
                    class="setting"
                >

                    <label>
                        Video kalitesi
                    </label>

                    <select id="quality">

                        <option value="best">
                            En iyi kalite
                        </option>

                        <option value="2160">
                            2160p • 4K
                        </option>

                        <option value="1440">
                            1440p
                        </option>

                        <option value="1080">
                            1080p
                        </option>

                        <option value="720">
                            720p
                        </option>

                        <option value="480">
                            480p
                        </option>

                        <option value="360">
                            360p
                        </option>

                    </select>

                </div>


                <!-- BITRATE -->

                <div
                    id="bitrateSetting"
                    class="setting"
                >

                    <label>
                        MP3 bitrate
                    </label>

                    <select id="bitrate">

                        <option value="128">
                            128 kbps
                        </option>

                        <option value="192">
                            192 kbps
                        </option>

                        <option value="256">
                            256 kbps
                        </option>

                        <option value="320">
                            320 kbps
                        </option>

                    </select>

                </div>

            </div>


            <!-- DOWNLOAD -->

            <button
                class="download-button"
                onclick="downloadVideo()"
            >
                ⬇ İNDİR
            </button>

        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        >
        </div>

    </div>


    <div class="footer">
        Ilyas Downloader © 2026
    </div>

</div>


<script>


// =====================================================
// MESAJ
// =====================================================

function showStatus(message, type = "") {

    const status =
        document.getElementById("status");

    status.style.display = "block";

    status.className =
        "status " + type;

    status.textContent =
        message;
}


function hideStatus() {

    document.getElementById("status")
        .style.display = "none";
}


// =====================================================
// VİDEO BİLGİSİ
// =====================================================

async function getVideoInfo() {

    const url =
        document.getElementById("url")
            .value
            .trim();


    if (!url) {

        showStatus(
            "Lütfen video bağlantısını gir.",
            "error"
        );

        return;
    }


    showStatus(
        "Video bilgileri getiriliyor..."
    );


    try {

        const response =
            await fetch(
                "/api/info",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        url: url
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok || data.error) {

            throw new Error(
                data.error ||
                "Video bilgileri alınamadı."
            );
        }


        document.getElementById(
            "videoCard"
        ).style.display = "block";


        document.getElementById(
            "settings"
        ).style.display = "block";


        document.getElementById(
            "videoTitle"
        ).textContent =
            data.title ||
            "Başlıksız video";


        document.getElementById(
            "thumbnail"
        ).src =
            data.thumbnail || "";


        let meta = "";


        if (data.duration) {

            meta +=
                "Süre: " +
                formatDuration(
                    data.duration
                );

        }


        if (data.uploader) {

            if (meta) {
                meta += " • ";
            }

            meta +=
                data.uploader;
        }


        document.getElementById(
            "videoMeta"
        ).textContent =
            meta;


        hideStatus();

    }

    catch (error) {

        showStatus(
            error.message,
            "error"
        );

    }

}


// =====================================================
// FORMAT DEĞİŞTİ
// =====================================================

function formatChanged() {

    const format =
        document.getElementById(
            "format"
        ).value;


    const quality =
        document.getElementById(
            "qualitySetting"
        );


    const bitrate =
        document.getElementById(
            "bitrateSetting"
        );


    if (format === "mp3") {

        quality.style.display =
            "none";

        bitrate.style.display =
            "block";

    }

    else {

        quality.style.display =
            "block";

        bitrate.style.display =
            "block";

    }

}


// =====================================================
// İNDİR
// =====================================================

async function downloadVideo() {

    const url =
        document.getElementById(
            "url"
        ).value.trim();


    const format =
        document.getElementById(
            "format"
        ).value;


    const quality =
        document.getElementById(
            "quality"
        ).value;


    const bitrate =
        document.getElementById(
            "bitrate"
        ).value;


    if (!url) {

        showStatus(
            "Önce video bağlantısını gir.",
            "error"
        );

        return;
    }


    showStatus(
        "Video hazırlanıyor, lütfen bekleyin..."
    );


    try {

        const response =
            await fetch(
                "/api/download",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        url: url,

                        format: format,

                        quality: quality,

                        bitrate: bitrate

                    })
                }
            );


        if (!response.ok) {

            let message =
                "İndirme başarısız.";

            try {

                const errorData =
                    await response.json();

                if (errorData.error) {

                    message =
                        errorData.error;
                }

            }

            catch (e) {}


            throw new Error(message);
        }


        const blob =
            await response.blob();


        const downloadUrl =
            window.URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            downloadUrl;


        const title =
            document.getElementById(
                "videoTitle"
            ).textContent ||
            "Ilyas Downloader";


        link.download =
            cleanFileName(title) +
            "." +
            format;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        window.URL.revokeObjectURL(
            downloadUrl
        );


        showStatus(
            "İndirme tamamlandı.",
            "success"
        );

    }

    catch (error) {

        showStatus(
            error.message,
            "error"
        );

    }

}


// =====================================================
// DOSYA ADI TEMİZLE
// =====================================================

function cleanFileName(name) {

    return name
        .replace(
            /[<>:"\/\\|?*]/g,
            ""
        )
        .trim();

}


// =====================================================
// SÜRE
// =====================================================

function formatDuration(seconds) {

    seconds =
        Number(seconds);


    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "";
    }


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(secs)
                .padStart(2, "0")
        );

    }


    return (
        minutes +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}


// =====================================================
// BAŞLANGIÇ
// =====================================================

formatChanged();

</script>

</body>
</html>
