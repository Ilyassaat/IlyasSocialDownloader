<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilyas Downloader</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #27304f 0%, transparent 35%),
                radial-gradient(circle at bottom right, #321d46 0%, transparent 35%),
                #080a10;
            color: white;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        .header {
            text-align: center;
            margin: 25px 0 35px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffffff, #8b8b8b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            font-size: 30px;
            font-weight: 900;
            box-shadow: 0 10px 40px rgba(255,255,255,.12);
        }

        h1 {
            margin-top: 18px;
            font-size: 38px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #9ca3af;
            margin-top: 8px;
            font-size: 15px;
        }

        .card {
            background: rgba(18, 21, 30, .88);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 80px rgba(0,0,0,.35);
            backdrop-filter: blur(20px);
        }

        .url-row {
            display: flex;
            gap: 12px;
        }

        .url-input {
            flex: 1;
            height: 58px;
            border-radius: 15px;
            border: 1px solid #303544;
            background: #0d1017;
            color: white;
            padding: 0 18px;
            font-size: 16px;
            outline: none;
        }

        .url-input:focus {
            border-color: #777;
        }

        button {
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 700;
            transition: .2s;
        }

        .info-btn {
            min-width: 150px;
            border-radius: 15px;
            background: linear-gradient(135deg, #ffffff, #bdbdbd);
            color: #101010;
            font-size: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: .92;
        }

        .video-info {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            background: #0d1017;
            border: 1px solid #292e3a;
        }

        .video-preview {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .thumbnail {
            width: 230px;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            background: #191d27;
        }

        .video-title {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.4;
        }

        .video-meta {
            color: #8f96a3;
            margin-top: 10px;
            font-size: 14px;
        }

        .settings {
            display: none;
            margin-top: 25px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .setting {
            background: #0d1017;
            border: 1px solid #292e3a;
            border-radius: 15px;
            padding: 16px;
        }

        .setting label {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 9px;
        }

        select {
            width: 100%;
            height: 45px;
            background: #151923;
            color: white;
            border: 1px solid #303544;
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
        }

        .download-btn {
            width: 100%;
            height: 55px;
            margin-top: 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffffff, #a9a9a9);
            color: #101010;
            font-size: 16px;
        }

        .status {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #11151e;
            color: #b8bec9;
            text-align: center;
        }

        .error {
            color: #ff7676;
        }

        .success {
            color: #7ee787;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555d6d;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px 10px;
            }

            .card {
                padding: 18px;
                border-radius: 18px;
            }

            h1 {
                font-size: 30px;
            }

            .url-row {
                flex-direction: column;
            }

            .info-btn {
                height: 52px;
            }

            .video-preview {
                flex-direction: column;
                align-items: stretch;
            }

            .thumbnail {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">ID</div>

        <h1>Ilyas Downloader</h1>

        <div class="subtitle">
            Instagram • TikTok • Facebook • YouTube
        </div>
    </div>

    <div class="card">

        <div class="url-row">
            <input
                id="url"
                class="url-input"
                type="text"
                placeholder="Video bağlantısını buraya yapıştır..."
            >

            <button class="info-btn" onclick="getInfo()">
                Videoyu Getir
            </button>
        </div>


        <div id="videoInfo" class="video-info">

            <div class="video-preview">

                <img
                    id="thumbnail"
                    class="thumbnail"
                    src=""
                    alt="Video"
                >

                <div>
                    <div id="videoTitle" class="video-title">
                        Video başlığı
                    </div>

                    <div id="videoMeta" class="video-meta">
                        Video bilgileri yükleniyor...
                    </div>
                </div>

            </div>

        </div>


        <div id="settings" class="settings">

            <div class="settings-grid">

                <div class="setting">

                    <label>Dosya türü</label>

                    <select id="format" onchange="changeFormat()">
                        <option value="mp4">MP4 Video</option>
                        <option value="mp3">MP3 Ses</option>
                    </select>

                </div>


                <div class="setting" id="qualityBox">

                    <label>Video kalitesi</label>

                    <select id="quality">

                        <option value="best">En iyi kalite</option>
                        <option value="2160">2160p (4K)</option>
                        <option value="1440">1440p</option>
                        <option value="1080">1080p</option>
                        <option value="720">720p</option>
                        <option value="480">480p</option>
                        <option value="360">360p</option>

                    </select>

                </div>


                <div class="setting" id="bitrateBox">

                    <label>MP3 bitrate</label>

                    <select id="bitrate">

                        <option value="128">128 kbps</option>
                        <option value="192">192 kbps</option>
                        <option value="256">256 kbps</option>
                        <option value="320">320 kbps</option>

                    </select>

                </div>

            </div>


            <button class="download-btn" onclick="downloadVideo()">
                ⬇ İNDİR
            </button>

        </div>


        <div id="status" class="status"></div>

    </div>


    <div class="footer">
        Ilyas Downloader © 2026
    </div>

</div>


<script>

async function getInfo() {

    const url = document.getElementById("url").value.trim();

    if (!url) {
        showStatus("Lütfen bir video bağlantısı gir.", "error");
        return;
    }

    showStatus("Video bilgileri getiriliyor...", "");

    try {

        const response = await fetch("/api/info", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                url: url
            })

        });

        const data = await response.json();

        if (!response.ok || data.error) {
            throw new Error(data.error || "Video bilgileri alınamadı.");
        }


        document.getElementById("videoInfo").style.display = "block";
        document.getElementById("settings").style.display = "block";


        document.getElementById("videoTitle").textContent =
            data.title || "Başlıksız video";


        document.getElementById("videoMeta").textContent =
            `${data.duration ? formatDuration(data.duration) : ""}`;


        if (data.thumbnail) {

            document.getElementById("thumbnail").src =
                data.thumbnail;

        }


        hideStatus();

    } catch (error) {

        showStatus(error.message, "error");

    }

}


function changeFormat() {

    const format =
        document.getElementById("format").value;

    const qualityBox =
        document.getElementById("qualityBox");

    const bitrateBox =
        document.getElementById("bitrateBox");


    if (format === "mp3") {

        qualityBox.style.display = "none";
        bitrateBox.style.display = "block";

    } else {

        qualityBox.style.display = "block";
        bitrateBox.style.display = "block";

    }

}


async function downloadVideo() {

    const url =
        document.getElementById("url").value.trim();

    const format =
        document.getElementById("format").value;

    const quality =
        document.getElementById("quality").value;

    const bitrate =
        document.getElementById("bitrate").value;


    if (!url) {
        showStatus("Önce video bağlantısını gir.", "error");
        return;
    }


    showStatus("İndirme hazırlanıyor...", "");


    try {

        const response = await fetch("/api/download", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                url: url,

                format: format,

                quality: quality,

                bitrate: bitrate

            })

        });


        if (!response.ok) {

            let errorText = "İndirme başarısız.";

            try {

                const data = await response.json();

                if (data.error) {
                    errorText = data.error;
                }

            } catch(e) {}

            throw new Error(errorText);
        }


        const blob = await response.blob();

        const downloadUrl =
            window.URL.createObjectURL(blob);


        const a =
            document.createElement("a");

        a.href = downloadUrl;

        a.download = getFileNameFromResponse(response);

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(downloadUrl);


        showStatus(
            "İndirme tamamlandı.",
            "success"
        );


    } catch (error) {

        showStatus(
            error.message,
            "error"
        );

    }

}


function getFileNameFromResponse(response) {

    const disposition =
        response.headers.get("Content-Disposition");


    if (disposition) {

        const match =
            disposition.match(
                /filename\*?=(?:UTF-8'')?["']?([^"';]+)["']?/i
            );

        if (match) {

            return decodeURIComponent(
                match[1]
            );

        }

    }


    const title =
        document.getElementById("videoTitle").textContent
        || "IlyasDownloader";


    const format =
        document.getElementById("format").value;


    return sanitizeFileName(title) + "." + format;

}


function sanitizeFileName(name) {

    return name
        .replace(/[<>:"/\\|?*]/g, "")
        .trim();

}


function formatDuration(seconds) {

    seconds = Number(seconds);

    if (!seconds || isNaN(seconds)) {
        return "";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        Math.floor(seconds % 60);


    if (hours > 0) {

        return `${hours}:${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

    }

    return `${minutes}:${String(secs).padStart(2,"0")}`;

}


function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.style.display = "block";

    status.textContent = message;

    status.className =
        "status " + type;

}


function hideStatus() {

    document.getElementById("status").style.display =
        "none";

}


changeFormat();

</script>

</body>
</html>
